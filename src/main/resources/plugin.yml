name: Site23Skin
version: '${project.version}'
main: fr.lucascha.site23skin.Site23SkinPlugin
api-version: '1.21'
description: Skins par grade pour serveur SCP – Site 23
authors: [ LucasCha ]
depend: [ SkinsRestorer ]

commands:
  skingrade:
    description: Applique le skin du grade à un joueur
    usage: /skingrade <joueur> <grade>
    permission: site23skin.skingrade
  skinretirer:
    description: Retire le skin de grade et restaure le skin original
    usage: /skinretirer <joueur>
    permission: site23skin.retirer
  skinreload:
    description: Recharge la configuration
    usage: /skinreload
    permission: site23skin.reload
  skininfo:
    description: Affiche le grade actuel d'un joueur
    usage: /skininfo [joueur]
    permission: site23skin.info
  espawn:
    description: Restaure le skin Mojang original (skin du compte MC) et téléporte au lobby
    usage: /espawn [joueur]
    permission: site23skin.espawn
  setlobby:
    description: Définit le point de lobby pour /espawn (position actuelle)
    usage: /setlobby
    permission: site23skin.setlobby
  tenue:
    description: Équipe la tenue de son grade actuel
    usage: /tenue [joueur]
    permission: site23skin.tenue
  rpmenu:
    description: Ouvre le menu GUI de tenue RP
    usage: /rpmenu
    permission: site23skin.rpmenu

permissions:
  site23skin.skingrade:
    description: Appliquer un skin de grade
    default: op
  site23skin.retirer:
    description: Retirer un skin de grade
    default: op
  site23skin.reload:
    description: Recharger la config
    default: op
  site23skin.info:
    description: Voir le grade d'un joueur
    default: op
  site23skin.espawn:
    description: Restaurer son propre skin Mojang original
    default: true
  site23skin.espawn.other:
    description: Restaurer le skin Mojang d'un autre joueur
    default: op
  site23skin.setlobby:
    description: Définir le point de lobby (/setlobby)
    default: op
  site23skin.tenue:
    description: S'équiper de sa propre tenue de grade
    default: true
  site23skin.tenue.other:
    description: Équiper la tenue d'un autre joueur
    default: op
  site23skin.rpmenu:
    description: Ouvrir le menu GUI de tenue RP
    default: true

